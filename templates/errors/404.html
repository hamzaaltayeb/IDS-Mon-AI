{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 5rem; color: var(--accent-cyan); margin-bottom: 20px;"><i class="fas fa-radar"></i> 404</div>
    <h2 style="font-size: 1.8rem; margin-bottom: 15px;">Resource Not Found</h2>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 30px auto;">
        The requested endpoint or security report does not exist.
    </p>
    <a href="/dashboard" class="btn btn-primary"><i class="fas fa-home"></i> Return to Dashboard</a>
</div>
{% endblock %}

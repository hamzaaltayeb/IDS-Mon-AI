{% extends "base.html" %}
{% block title %}500 Internal Error{% endblock %}
{% block content %}
<div style="text-align: center; padding: 80px 20px;">
    <div style="font-size: 5rem; color: var(--sev-critical); margin-bottom: 20px;"><i class="fas fa-bug"></i> 500</div>
    <h2 style="font-size: 1.8rem; margin-bottom: 15px;">Internal Server Error</h2>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 30px auto;">
        An unexpected error occurred in the monitoring subsystem.
    </p>
    <a href="/dashboard" class="btn btn-primary"><i class="fas fa-home"></i> Return to Dashboard</a>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Authentication - AI-NSMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/soc_theme.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #111827 0%, #060911 100%);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 16px;
            padding: 40px 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.15);
            backdrop-filter: blur(15px);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo {
            font-size: 2.8rem;
            color: var(--accent-cyan);
            margin-bottom: 12px;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        .quick-accounts {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .quick-btn {
            background: #1f293d;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><i class="fas fa-shield-halved"></i></div>
                <h2 style="font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;">AI-NSMS</h2>
                <p style="color: var(--text-secondary); font-size: 0.88rem;">Intelligent Network Security SOC Portal</p>
            </div>

            {% if error %}
            <div class="flash-msg flash-error" style="margin-bottom: 20px;">
                <i class="fas fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> Username or Email</label>
                    <input type="text" id="identifier" name="identifier" class="form-control" placeholder="admin or analyst" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                        <i class="fas fa-eye" id="toggle-pwd" style="position: absolute; right: 12px; top: 12px; color: var(--text-muted); cursor: pointer;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem; margin-top: 10px;">
                    <i class="fas fa-right-to-bracket"></i> Authenticate & Enter SOC
                </button>
            </form>

            <div class="quick-accounts">
                <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 8px;">Demo Testing Accounts (Click to Fill):</p>
                <button type="button" class="quick-btn" onclick="fillCreds('admin', 'Admin@12345')">
                    <i class="fas fa-user-shield"></i> Admin: admin
                </button>
                <button type="button" class="quick-btn" onclick="fillCreds('analyst', 'Analyst@12345')">
                    <i class="fas fa-user-tag"></i> Analyst: analyst
                </button>
            </div>
        </div>
    </div>

    <script>
        const togglePwd = document.getElementById('toggle-pwd');
        const pwdInput = document.getElementById('password');
        togglePwd.addEventListener('click', () => {
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);
            togglePwd.classList.toggle('fa-eye');
            togglePwd.classList.toggle('fa-eye-slash');
        });

        function fillCreds(u, p) {
            document.getElementById('identifier').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
